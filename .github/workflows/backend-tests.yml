name: Backend tests

on:
  push:
    branches: [main, test/backend-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-test.txt
      - name: Install pinned runtime and test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify disposable PostgreSQL prerequisites
        run: |
          docker info
          docker pull postgres:17
      - name: Install test-only Chromium
        run: python -m playwright install --with-deps chromium
      - name: Existing 14 unit tests
        run: python -m scripts.test_materials_unit
      - name: Integration tests with owned PostgreSQL and temporary storage
        run: python -m pytest tests -v --postgres-backend=docker
